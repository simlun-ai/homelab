name: CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Initialize public code at the parent-pinned revision
        run: git submodule update --init --recursive -- tools/homelab-hsm
      - uses: docker/setup-buildx-action@v4
      - name: Run the same checks as local development
        run: make ci

name: CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Initialize public code at the parent-pinned revision
        run: |
          # Use anonymous HTTPS in CI; developer checkouts keep the SSH URL.
          git config submodule.tools/homelab-hsm.url https://github.com/simlun-ai/homelab-hsm.git
          git submodule update --init --recursive -- tools/homelab-hsm
      - uses: docker/setup-buildx-action@v4
      - name: Run the same checks as local development
        run: make ci

  ups-ubuntu-2204:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify Ubuntu 22.04 workstation setup with a selected Python
        run: |
          bash support/ups/install-system-dependencies.sh
          make -C support/ups tools
          make -C support/ups inventory syntax

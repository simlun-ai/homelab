# Offline RAID1 draft for trust-cp1. Applying these documents can write to disk.
apiVersion: v1alpha1
kind: RAIDArrayConfig
name: boot
level: raid1
metadata: "1.0"
provisioning:
  volumeSelector:
    match: >-
      "/dev/disk/by-id/ata-Intenso_SSD_Sata_III_2025032901388" in disk.symlinks ||
      "/dev/disk/by-id/ata-SPCC_Solid_State_Disk_WWDD250221070002136" in disk.symlinks
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  image: factory.talos.dev/metal-installer/c388d7fe0077e7d054f4a4d76fe7bb0a7fba9741b0ad2569be0a410b2c54f940:v1.14.5@sha256:3d7a3a87e00e553b754a53a08a6890a7b19e00b7bdae28de763c357ee35c24dc
provisioning:
  diskSelector:
    match: '"/dev/disk/by-id/md-name-talos:boot" in disk.symlinks'

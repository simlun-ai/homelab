apiVersion: v1alpha1
kind: KubeNetworkConfig
podSubnets:
  - 10.128.0.0/16
serviceSubnets:
  - 10.240.0.0/16
---
apiVersion: v1alpha1
kind: HostnameConfig
auto: off
hostname: trust-cp1
---
# Initial interface name must be verified on Trust Pi hardware.
apiVersion: v1alpha1
kind: LinkConfig
name: eth0
up: true
addresses:
  - address: 10.10.0.10/24
routes:
  - gateway: 10.10.0.1
---
apiVersion: v1alpha1
kind: ResolverConfig
nameservers:
  - address: 10.10.0.1

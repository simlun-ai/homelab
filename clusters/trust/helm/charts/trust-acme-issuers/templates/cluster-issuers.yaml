{{- range $name, $server := .Values.issuers }}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ $name | quote }}
spec:
  acme:
    email: {{ $.Values.email | quote }}
    server: {{ $server | quote }}
    privateKeySecretRef:
      name: {{ printf "%s-account" $name | quote }}
    solvers:
      - selector:
          dnsZones:
            - {{ $.Values.dnsZone | quote }}
        dns01:
          cloudflare:
            apiTokenSecretRef:
              name: {{ $.Values.cloudflareTokenSecret | quote }}
              key: api-token
{{- end }}

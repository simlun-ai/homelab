apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: trust-services
  namespace: {{ .Release.Namespace }}
spec:
  addresses:
    - 10.10.0.200-10.10.0.209
  autoAssign: false
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: trust-services
  namespace: {{ .Release.Namespace }}
spec:
  ipAddressPools:
    - trust-services

global:
  tlsDisable: false

injector:
  enabled: false

server:
  updateStrategyType: OnDelete
  configAnnotation: true
  authDelegator:
    enabled: false
  serviceAccount:
    serviceDiscovery:
      enabled: false
  volumes:
    - name: api-tls
      secret:
        secretName: openbao-api-tls
        defaultMode: 0440
  volumeMounts:
    - name: api-tls
      mountPath: /openbao/tls
      readOnly: true
  statefulSet:
    securityContext:
      container:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
  readinessProbe:
    path: /v1/sys/health
  service:
    active:
      enabled: false
    standby:
      enabled: false
    publishNotReadyAddresses: false
  dataStorage:
    size: 10Gi
    storageClass: trust-zfs-retain
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  standalone:
    enabled: false
  ha:
    enabled: true
    replicas: 1
    apiAddr: https://bao.k8s-aux.simlun.se
    disruptionBudget:
      enabled: false
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true

        listener "tcp" {
          address         = "0.0.0.0:8200"
          cluster_address = "127.0.0.1:8201"
          tls_cert_file   = "/openbao/tls/tls.crt"
          tls_key_file    = "/openbao/tls/tls.key"
          tls_auto_reload = true
        }

        storage "raft" {
          path = "/openbao/data"
        }

extraObjects:
  - apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: openbao-api
      namespace: "{{ .Release.Namespace }}"
    spec:
      secretName: openbao-api-tls
      dnsNames:
        - bao.k8s-aux.simlun.se
      issuerRef:
        name: letsencrypt-production
        kind: ClusterIssuer
        group: cert-manager.io
      privateKey:
        rotationPolicy: Always

  - apiVersion: v1
    kind: Service
    metadata:
      name: openbao-https
      namespace: "{{ .Release.Namespace }}"
      annotations:
        metallb.io/loadBalancerIPs: "10.10.0.200"
    spec:
      type: LoadBalancer
      allocateLoadBalancerNodePorts: false
      ports:
        - name: https
          port: 443
          targetPort: 8200
      selector:
        app.kubernetes.io/name: openbao
        app.kubernetes.io/instance: "{{ .Release.Name }}"
        component: server

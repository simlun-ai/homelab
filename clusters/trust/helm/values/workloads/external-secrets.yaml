# Install the ExternalSecret and SecretStore API definitions with the chart.
installCRDs: true
rbac:
  # Grant token creation for each store's service account through a namespaced Role.
  serviceAccountTokenCreate: false
serviceAccount:
  # Keep the controller account name stable for the namespaced RoleBindings.
  name: external-secrets
# Use namespaced SecretStores for the initial workload secret delivery.
processClusterStore: false
# Keep ExternalSecret definitions in each consumer's namespace for now.
processClusterExternalSecret: false
# This rollout uses provider-backed secrets and has no cluster-wide generators.
processClusterGenerator: false
# The Trust certificate factory publishes TLS Secrets through namespaced PushSecrets.
processPushSecret: true
# Keep cluster-wide PushSecret replication disabled until it has a consumer.
processClusterPushSecret: false

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "homelab-helpers"
version = "0.1.0"
description = "Scoped homelab administration helpers"
requires-python = ">=3.13,<3.15"
dependencies = ["homelab-secrets==0.1.0"]

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["homelab*"]
[tool.ruff]
target-version = "py313"
src = ["scripts", "tests"]
line-length = 88
required-version = "==0.17.2"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

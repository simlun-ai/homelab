[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "homelab-helpers"
version = "0.1.0"
description = "Scoped homelab administration helpers"
requires-python = ">=3.11,<3.15"
dependencies = ["homelab-secrets==0.1.0"]

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["homelab*"]


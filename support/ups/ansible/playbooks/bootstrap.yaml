- name: Bootstrap one UPS coordinator
  hosts: ups_coordinators
  gather_facts: false
  become: false
  any_errors_fatal: true
  pre_tasks:
    - name: Check target selection before connecting
      ansible.builtin.import_tasks: ../tasks/single-host.yaml

  tasks:
    - name: Install Python prerequisites only when missing
      become: true
      ansible.builtin.raw: |
        set -eu
        missing=0
        for package in python3 python3-apt; do
          if [ "$(dpkg-query -W -f='${db:Status-Status}' "$package" 2>/dev/null || true)" != installed ]; then
            missing=1
          fi
        done
        if [ "$missing" -eq 1 ]; then
          apt-get update
          apt-get install --yes --no-install-recommends python3 python3-apt
          printf '%s\n' HOMELAB_PYTHON_INSTALLED
        fi
      register: python_bootstrap
      changed_when: "'HOMELAB_PYTHON_INSTALLED' in python_bootstrap.stdout"

    - name: Maintain passwordless administrative sudo
      become: true
      ansible.builtin.copy:
        src: ../files/010-homelab-administrator
        dest: /etc/sudoers.d/010-homelab-administrator
        owner: root
        group: root
        mode: '0440'
        validate: /usr/sbin/visudo -cf %s

    - name: Validate the complete sudo configuration
      become: true
      ansible.builtin.command: /usr/sbin/visudo -c
      changed_when: false

    - name: Look up the administrator home
      ansible.builtin.getent:
        database: passwd
        key: administrator

    - name: Create administrator SSH directory
      become: true
      ansible.builtin.file:
        path: "{{ ansible_facts.getent_passwd.administrator[4] }}/.ssh"
        state: directory
        owner: administrator
        group: administrator
        mode: '0700'

    - name: Authorize only the repository coordinator key
      become: true
      ansible.builtin.copy:
        src: "{{ inventory_dir }}/coordinator_ed25519.pub"
        dest: "{{ ansible_facts.getent_passwd.administrator[4] }}/.ssh/authorized_keys"
        owner: administrator
        group: administrator
        mode: '0600'

    - name: Reconnect with the managed SSH identity
      ansible.builtin.meta: reset_connection

    - name: Verify the base setup
      ansible.builtin.import_tasks: ../tasks/verify.yaml

- name: Verify coordinator hardening
  hosts: ups_coordinators
  gather_facts: false
  become: false
  pre_tasks:
    - name: Check target selection before connecting
      ansible.builtin.import_tasks: ../tasks/single-host.yaml
  tasks:
    - name: Verify base access
      ansible.builtin.import_tasks: ../tasks/verify.yaml
    - name: Check installed hardening and active memory protections
      become: true
      ansible.builtin.script: >-
        ../roles/coordinator_hardening/files/verify-hardening.py
        {{ coordinator_hardening_management_networks | map('quote') | join(' ') }}
      args:
        executable: /usr/bin/python3
      changed_when: false

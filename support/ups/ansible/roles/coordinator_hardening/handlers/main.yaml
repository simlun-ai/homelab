- name: Reload SSH
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded

- name: Reload firewall
  ansible.builtin.systemd_service:
    name: nftables
    state: reloaded

- name: Restart journal
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted

- name: Apply core dump restrictions
  ansible.builtin.command: /usr/sbin/sysctl -p /etc/sysctl.d/90-coordinator-hardening.conf
  changed_when: true

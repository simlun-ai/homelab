- name: Require management networks
  ansible.builtin.assert:
    that: coordinator_hardening_management_networks | length > 0

- name: Install firewall and security update tooling
  ansible.builtin.apt:
    name: [nftables, unattended-upgrades]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Look up the administrator home
  ansible.builtin.getent:
    database: passwd
    key: administrator

- name: Set SSH directory permissions
  ansible.builtin.file:
    path: "{{ ansible_facts.getent_passwd.administrator[4] }}/.ssh"
    state: directory
    owner: administrator
    group: administrator
    mode: '0700'

- name: Preserve authorized keys with private permissions
  ansible.builtin.file:
    path: "{{ ansible_facts.getent_passwd.administrator[4] }}/.ssh/authorized_keys"
    state: file
    owner: administrator
    group: administrator
    mode: '0600'

- name: Configure key-only administrative SSH
  ansible.builtin.copy:
    src: sshd_config
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: '0600'
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload SSH

- name: Configure the host firewall
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: '0644'
    validate: /usr/sbin/nft -c -f %s
  notify: Reload firewall

- name: Enable the firewall
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started

- name: Configure daily automatic security updates without reboots
  ansible.builtin.template:
    src: 52homelab-unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/52homelab-unattended-upgrades
    owner: root
    group: root
    mode: '0644'

- name: Enable daily APT timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [apt-daily.timer, apt-daily-upgrade.timer]

- name: Create configuration drop-in directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /etc/systemd/journald.conf.d
    - /etc/systemd/coredump.conf.d
    - /etc/rpi/swap.conf.d

- name: Bound persistent and runtime journal storage
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/90-coordinator.conf
    mode: '0644'
    content: |
      [Journal]
      Storage=persistent
      SystemMaxUse=64M
      RuntimeMaxUse=16M
      MaxRetentionSec=7day
  notify: Restart journal

- name: Disable systemd core dump processing
  ansible.builtin.copy:
    dest: /etc/systemd/coredump.conf.d/90-coordinator.conf
    mode: '0644'
    content: |
      [Coredump]
      Storage=none
      ProcessSizeMax=0

- name: Discard kernel core dumps immediately
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-coordinator-hardening.conf
    mode: '0644'
    content: |
      kernel.core_pattern = |/bin/false
      fs.suid_dumpable = 0
  notify: Apply core dump restrictions

- name: Disable hibernation and suspend
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    masked: true
  loop: [sleep.target, suspend.target, hibernate.target, hybrid-sleep.target, suspend-then-hibernate.target]

- name: Disable legacy disk swap management if installed
  ansible.builtin.systemd_service:
    name: dphys-swapfile.service
    enabled: false
    masked: true
  when: "'dphys-swapfile.service' in ansible_facts.services"

- name: Remove persistent disk swap entries
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^\s*[^#\s]+\s+\S+\s+swap\s+'
    state: absent

- name: Select RAM-only zram without disk writeback on current Raspberry Pi OS
  ansible.builtin.copy:
    dest: /etc/rpi/swap.conf.d/99-coordinator.conf
    mode: '0644'
    content: |
      [Main]
      Mechanism=zram

- name: Disable unused Bluetooth services when present
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    state: stopped
    masked: true
  loop: [bluetooth.service, hciuart.service]
  when:
    - coordinator_hardening_disable_radios
    - item in ansible_facts.services

- name: Disable wireless radios at the next manual boot
  ansible.builtin.blockinfile:
    path: /boot/firmware/config.txt
    marker: "# {mark} ANSIBLE COORDINATOR RADIOS"
    block: |
      [all]
      dtoverlay=disable-wifi
      dtoverlay=disable-bt
    state: "{{ 'present' if coordinator_hardening_disable_radios else 'absent' }}"

- name: Disable mDNS only when explicitly selected
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    state: stopped
    masked: true
  loop: [avahi-daemon.socket, avahi-daemon.service]
  when:
    - coordinator_hardening_disable_mdns
    - "'avahi-daemon.service' in ansible_facts.services"

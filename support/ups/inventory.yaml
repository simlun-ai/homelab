# Names must resolve through workstation DNS or existing SSH configuration.
# If needed, set ansible_host to each verified management address.
all:
  children:
    ups_coordinators:
      vars:
        ansible_user: administrator
        # OpenSSH selects the corresponding private identity from ssh-agent.
        ansible_ssh_private_key_file: "{{ inventory_dir }}/coordinator_ed25519.pub"
        coordinator_hardening_management_networks: [192.168.254.0/24]
        ansible_python_interpreter: /usr/bin/python3
      hosts:
        ups-aux:
        ups-pi:
        ups-metal:

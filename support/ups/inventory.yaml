# Connection names must resolve through workstation DNS or SSH configuration.
# Use ansible_host when the connection name differs from the inventory name.
all:
  children:
    ups_coordinators:
      vars:
        ansible_user: administrator
        # OpenSSH selects the corresponding private identity from ssh-agent.
        ansible_ssh_private_key_file: "{{ inventory_dir }}/coordinator_ed25519.pub"
        coordinator_hardening_management_networks: [192.168.254.0/24]
        ansible_python_interpreter: /usr/bin/python3
      hosts:
        ups-aux:
          coordinator_hardening_firewall_services:
            - sources: "{{ coordinator_hardening_management_networks + ['10.10.0.10/32'] }}"
              protocol: tcp
              port: 443
          ansible_host: ups-aux.k8s-aux.lundmark.internal
        ups-pi:
        ups-metal:
